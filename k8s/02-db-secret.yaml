# Secret con credenciales para MongoDB (Base64)
# Este Secret contiene las credenciales del usuario administrador de la base de datos.
# Los valores originales (en texto plano) son:
#   DB_USER: admin_s08
#   DB_PASS: SuperClave2026!
# Se codifican en Base64 para cumplir con los requisitos de Kubernetes.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: practica-s08
  labels:
    app: backend
    type: opaque
type: Opaque
# Datos codificados en Base64
# Cada clave debe estar en Base64 sin saltos de línea.
stringData: {}
data:
  DB_USER: YWRtaW5fczA4
  DB_PASS: U3VwZXJDbGF2ZTIwMjYh
