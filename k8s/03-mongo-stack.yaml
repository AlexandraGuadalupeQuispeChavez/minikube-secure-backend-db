# Deployment y Service para MongoDB
# Este manifiesto crea dos objetos separados por '---':
# 1) Deployment llamado mongo-deployment que ejecuta la imagen oficial de MongoDB (versión 7.0).
#    Se define 1 réplica y se expone el puerto 27017. Las credenciales del usuario root
#    se inyectan desde el Secret 'db-secret' mediante las variables de entorno
#    MONGO_INITDB_ROOT_USERNAME y MONGO_INITDB_ROOT_PASSWORD.
# 2) Service llamado mongo-service de tipo ClusterIP para acceso interno dentro del
#    clúster. Permite que otros pods (el backend) comuniquen al puerto 27017.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  namespace: practica-s08
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: practica-s08
  labels:
    app: mongo
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
