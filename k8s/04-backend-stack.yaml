# Deployment y Service para el backend (Node.js)
# Este manifiesto crea dos objetos separados por '---':
# 1) Deployment llamado backend-deployment que ejecuta la imagen local 'backend-s08:v1'.
#    Utiliza imagePullPolicy: IfNotPresent para usar la imagen construida en el Docker de Minikube.
#    Inyecta todas las variables de entorno desde el ConfigMap 'app-config' y el Secret 'db-secret'
#    mediante envFrom.
# 2) Service llamado backend-service de tipo NodePort para exponer el puerto 3000 fuera del clúster.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: practica-s08
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend-s08:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: practica-s08
  labels:
    app: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 3000            # Puerto interno del pod
      targetPort: 3000      # Puerto del contenedor
      nodePort: 30080       # Puerto accesible desde el host (NodePort)
      protocol: TCP
